<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az ajánlatkérésed állapota — SOS Felnijavítás</title>
<style>
  :root{
    --dark:#14181B;
    --light:#F5F5F4;
    --white:#FFFFFF;
    --text-dark:#14181B;
    --text-muted:#5B6167;
    --accent:#E0262B;
    --accent-dark:#B81E22;
    --border:#E3E1DD;
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);background:var(--light);color:var(--text-dark);font-size:15px;line-height:1.55;}
  header{padding:18px 20px;background:var(--dark);color:#fff;}
  header .logo{font-weight:800;font-size:16px;}
  header .logo span{color:var(--accent);}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 60px;}
  .card{background:#fff;border-radius:var(--radius-lg);padding:22px 20px;box-shadow:0 2px 14px rgba(0,0,0,.05);margin-bottom:16px;}
  h1{font-size:19px;margin:0 0 4px;}
  h2{font-size:15px;margin:0 0 10px;}
  p{margin:0 0 10px;color:var(--text-muted);font-size:13.5px;}
  .muted{color:var(--text-muted);font-size:12.5px;}

  .steps{display:flex;justify-content:space-between;margin:18px 0 6px;position:relative;}
  .steps::before{content:"";position:absolute;top:9px;left:16px;right:16px;height:2px;background:var(--border);z-index:0;}
  .step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;}
  .step .dot{width:20px;height:20px;border-radius:50%;background:var(--border);border:2px solid var(--border);flex-shrink:0;}
  .step.done .dot{background:var(--accent);border-color:var(--accent);}
  .step .lbl{font-size:9px;color:var(--text-muted);text-align:center;margin-top:6px;width:100%;padding:0 2px;line-height:1.25;overflow-wrap:anywhere;word-break:break-word;hyphens:auto;}
  .step.done .lbl{color:var(--text-dark);font-weight:700;}

  .status-banner{border-radius:var(--radius-md);padding:14px 16px;font-size:13.5px;font-weight:700;margin-bottom:4px;}
  .status-elutasitva{background:#FDE9E9;color:#8A1414;}
  .status-kesz{background:#E8F5E9;color:#1B5E20;}
  .status-normal{background:#F5F5F4;color:var(--text-dark);}

  .detail-list{margin-top:14px;}
  .detail-list .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .detail-list .row:last-child{border-bottom:none;}
  .detail-list .k{color:var(--text-muted);}
  .detail-list .v{font-weight:700;text-align:right;}

  .price-final{background:var(--dark);color:#fff;border-radius:var(--radius-md);padding:16px;text-align:center;margin-top:14px;}
  .price-final .lbl{font-size:11px;color:#A3A8AC;text-transform:uppercase;letter-spacing:.4px;}
  .price-final .val{font-size:24px;font-weight:800;margin-top:4px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    min-height:48px;padding:12px 22px;border-radius:var(--radius-sm);
    font-family:var(--font);font-size:15px;font-weight:700;border:none;cursor:pointer;text-decoration:none;
  }
  .btn-ghost-light{background:transparent;color:var(--text-dark);border:1.5px solid var(--border);margin-top:10px;}
  .btn-primary{background:var(--accent);color:#fff;}
  a.tel{color:var(--accent);font-weight:700;text-decoration:none;}

  .error-box{text-align:center;padding:40px 10px;}

  @media print {
    header, .btn-ghost-light, .no-print { display:none !important; }
    body{background:#fff;}
    .card{box-shadow:none;border:1px solid var(--border);}
  }
</style>
</head>
<body>

<header>
  <div class="logo">SOS Felnijavítás <span>· saját nézet</span></div>
</header>

<div class="wrap" id="app">
  <div class="card"><p>Betöltés...</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="db.js"></script>
<script>
(function () {
  "use strict";

  var STEP_ORDER = ["uj", "kapcsolatfelvetel", "ajanlat_kuldve", "elfogadva", "folyamatban", "kesz"];
  // A step-sávban rövidített feliratok jelennek meg (a keskeny, mobilra optimalizált
  // hely miatt) — a teljes, pontos leírást a STATUS_TEXT bekezdés adja alattuk.
  var STEP_LABEL = {
    uj: "Beérkezett", kapcsolatfelvetel: "Kapcsolat",
    ajanlat_kuldve: "Ajánlat", elfogadva: "Elfogadva",
    folyamatban: "Folyamat", kesz: "Kész"
  };
  var STATUS_TEXT = {
    uj: "Megkaptuk az ajánlatkérésed, hamarosan felvesszük veled a kapcsolatot.",
    kapcsolatfelvetel: "Felvettük veled a kapcsolatot, egyeztetjük a részleteket.",
    ajanlat_kuldve: "Kiküldtük a végleges árajánlatot — nézd meg az e-mailed vagy hívunk telefonon.",
    elfogadva: "Elfogadtad az ajánlatot, ütemezzük a munkát.",
    folyamatban: "A felnid javítása folyamatban van a műhelyben.",
    kesz: "A javítás elkészült! Keress minket az átvételhez.",
    elutasitva: "Ez az ajánlatkérés lezárásra került."
  };
  var MUNKA_LABEL = {
    gorgozes: "Görgőzés", spot: "Gyors spotjavítás", komplett: "Komplett felújítás",
    cnc: "CNC / diamond-cut", egyedi: "Egyedi szín / showroom"
  };

  function esc(s) {
    return (s === null || s === undefined ? "" : String(s)).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtFt(n) { return (n === null || n === undefined) ? "—" : n.toLocaleString("hu-HU") + " Ft"; }
  function fmtWhen(iso) {
    try { return new Date(iso).toLocaleDateString("hu-HU"); } catch (e) { return iso; }
  }

  function getToken() {
    var m = window.location.search.match(/[?&]token=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function renderError(msg) {
    document.getElementById("app").innerHTML =
      '<div class="card error-box">' +
        '<h1>Nem található</h1>' +
        '<p>' + esc(msg) + '</p>' +
        '<p class="muted">Ha hibára gyanakszol, hívj minket: <a class="tel" href="tel:+36204848958">06 20 484 8958</a></p>' +
      '</div>';
  }

  function renderSteps(allapot) {
    if (allapot === "elutasitva") return "";
    var idx = STEP_ORDER.indexOf(allapot);
    return '<div class="steps">' + STEP_ORDER.map(function (s, i) {
      return '<div class="step' + (i <= idx ? ' done' : '') + '"><div class="dot"></div><div class="lbl">' + esc(STEP_LABEL[s]) + '</div></div>';
    }).join("") + '</div>';
  }

  function renderLead(lead) {
    var bannerClass = lead.allapot === "elutasitva" ? "status-elutasitva" : (lead.allapot === "kesz" ? "status-kesz" : "status-normal");

    var detailRows = "";
    if (lead.forras === "kalkulator") {
      detailRows =
        '<div class="row"><span class="k">Darabszám</span><span class="v">' + esc(lead.darabszam) + ' db</span></div>' +
        '<div class="row"><span class="k">Felniméret</span><span class="v">' + esc(lead.felni_meret || "—") + '</span></div>' +
        '<div class="row"><span class="k">Munka</span><span class="v">' + esc(MUNKA_LABEL[lead.munka_tipus] || lead.munka_tipus || "—") + '</span></div>' +
        '<div class="row"><span class="k">Gumiszerelés</span><span class="v">' + (lead.gumiszereles ? "igen" : "nem") + '</span></div>';
    } else {
      detailRows =
        '<div class="row"><span class="k">Darabszám</span><span class="v">' + esc(lead.darabszam || "—") + '</span></div>' +
        '<div class="row"><span class="k">Felniméret</span><span class="v">' + esc(lead.felni_meret || "—") + '</span></div>' +
        '<div class="row"><span class="k">Beküldve</span><span class="v">fotó alapján</span></div>';
    }

    var priceHtml = "";
    if (lead.vegleges_ar) {
      priceHtml = '<div class="price-final"><div class="lbl">Végleges ár</div><div class="val">' + fmtFt(lead.vegleges_ar) + '</div></div>';
    } else if (lead.becsult_osszeg_szoveg) {
      priceHtml = '<div class="price-final"><div class="lbl">Előzetes becslés</div><div class="val">' + esc(lead.becsult_osszeg_szoveg) + '</div></div>';
    }

    document.getElementById("app").innerHTML =
      '<div class="card">' +
        '<h1>Szia' + (lead.nev ? ", " + esc(lead.nev.split(" ")[0]) : "") + '!</h1>' +
        '<p class="muted">Beküldve: ' + fmtWhen(lead.created_at) + '</p>' +
        '<div class="status-banner ' + bannerClass + '">' + esc(STATUS_TEXT[lead.allapot] || "") + '</div>' +
        renderSteps(lead.allapot) +
        priceHtml +
        '<div class="detail-list">' + detailRows + '</div>' +
      '</div>' +
      '<div class="card no-print">' +
        '<h2>Kérdésed van?</h2>' +
        '<p>Hívj minket, vagy nézd meg a teljes árlistát és a folyamatot a főoldalon.</p>' +
        '<a class="tel" href="tel:+36204848958">06 20 484 8958</a>' +
        '<button class="btn btn-ghost-light" onclick="window.print()">Mentés / nyomtatás (PDF)</button>' +
      '</div>';
  }

  var token = getToken();
  if (!token) {
    renderError("Ehhez az oldalhoz egy egyedi linkre van szükség, amit a fotó vagy kalkulátoros beküldés után kaptál.");
    return;
  }

  Leads.getByToken(token).then(function (res) {
    if (res.error || !res.data) {
      renderError("Nem találtunk ilyen ajánlatkérést. Lehet, hogy a link elavult, vagy elgépelted.");
      return;
    }
    renderLead(res.data);
  });
})();
</script>
</body>
</html>
